name: Deploy frontend

# 仓库现在的主分支是 master。两个都写上，将来真改名成 main 也不用回来改这里。
on:
  push:
    branches: [master, main]
  workflow_dispatch:

# 连着推两次时，让后一次直接取代前一次，避免两个部署互相踩
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy to server
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Vite 7 要求 ^20.19 || >=22.12，原来写的 18 会直接装不上
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        # 产物在 frontend/dist（不是 build）
        run: npm run build

      - name: Configure SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh

          # tr -d '\r'：在 Windows 上复制私钥很容易带上 CRLF，
          # OpenSSH 会直接判为格式非法。这里统一清掉
          printf '%s\n' "$SERVER_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # 先确认私钥本身能解析，否则后面只会得到一个没有信息量的 255
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "::error::SERVER_SSH_KEY 无法解析。请确认粘贴了完整私钥，"
            echo "::error::包含 -----BEGIN/END OPENSSH PRIVATE KEY----- 两行。"
            exit 1
          fi
          echo "私钥解析正常，指纹："
          ssh-keygen -lf <(ssh-keygen -y -f ~/.ssh/deploy_key)

          if [ -z "$SERVER_HOST" ]; then
            echo "::error::SERVER_HOST 是空的，secret 没配上"; exit 1
          fi

          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::ssh-keyscan 拿不到 $SERVER_HOST 的主机密钥，检查 IP 和 22 端口"
            exit 1
          fi

      - name: Verify SSH access
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o IdentitiesOnly=yes \
            "$SERVER_USER@$SERVER_HOST" \
            "echo 已连接；touch /var/www/dope-website/.ci-probe && rm -f /var/www/dope-website/.ci-probe && echo 目录可写"

      - name: Upload
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -e
          # --delete 会清掉服务器上多余的旧文件，否则改了文件名的旧构建
          # 产物会一直堆在那里
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o IdentitiesOnly=yes" \
            frontend/dist/ \
            "$SERVER_USER@$SERVER_HOST:/var/www/dope-website/"

          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o IdentitiesOnly=yes \
            "$SERVER_USER@$SERVER_HOST" \
            "chown -R nginx:nginx /var/www/dope-website && chmod -R a+rX /var/www/dope-website"

      - name: Smoke test
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        # 部署完要真的验一下。只看 rsync 成功不够 —— 之前就出过
        # 首页正常但深层路由白屏的情况
        run: |
          HOST="$SERVER_HOST"
          fail=0
          for path in / /review /review/films /blog-post; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "http://$HOST$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || fail=1
          done

          # 首页引用的 JS 必须真的能取到，且 MIME 正确。
          # 路径配错时它会被 SPA 回退成 index.html，浏览器直接白屏
          asset=$(curl -s --max-time 20 "http://$HOST/" | grep -oE 'src="/assets/[^"]+\.js"' | head -1 | sed 's/src="//;s/"//')
          type=$(curl -s -o /dev/null -w '%{content_type}' --max-time 20 "http://$HOST$asset")
          echo "$asset -> $type"
          case "$type" in *javascript*) ;; *) fail=1 ;; esac

          exit $fail

# 后端没有纳入部署：它现在只是个 /health 占位，nginx 也没有反代到它。
# 真要上线时，这里加一个 setup-dotnet（9.0.x）+ dotnet publish，
# 再传到服务器并用 systemd 托管，同时给 nginx 加一段 location /api 反代。
