# 放到服务器的 /etc/nginx/conf.d/dope-website.conf，然后：
#
#   sudo nginx -t && sudo systemctl reload nginx
#
# 证书由 acme.sh 签发和续期（见本文件末尾的说明）。

# ---------------------------------------------------------------------------
# 80 端口：只做两件事 —— 放行 ACME 校验，其余全部赶到 HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name l9k.dev www.l9k.dev;

    # Let's Encrypt 的 HTTP-01 校验必须走明文 80，所以它要排在跳转前面。
    # ^~ 让这条优先于普通前缀匹配；单独用 /var/www/acme 而不是站点目录，
    # 是因为 CI 的 rsync --delete 会清掉站点目录里的多余文件，
    # 续期正好撞上就会失败
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        try_files $uri =404;
    }

    location / {
        return 301 https://l9k.dev$request_uri;
    }
}

# ---------------------------------------------------------------------------
# www 一律并到裸域，避免同一份内容两个地址
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.l9k.dev;

    ssl_certificate     /etc/nginx/ssl/l9k.dev.fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/l9k.dev.key;

    return 301 https://l9k.dev$request_uri;
}

# ---------------------------------------------------------------------------
# 正主
# ---------------------------------------------------------------------------
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name l9k.dev;

    ssl_certificate     /etc/nginx/ssl/l9k.dev.fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/l9k.dev.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 不开 OCSP stapling：Let's Encrypt 已经停掉了 OCSP 响应器，
    # 开着只会让 nginx 每次启动都去请求一个不存在的服务并打警告

    # .dev 整个顶级域本来就在浏览器的 HSTS 预加载列表里，这条头对浏览器
    # 来说是锦上添花；写上是为了让策略显式，不依赖"恰好这个 TLD 特殊"。
    #
    # 注意 nginx 的 add_header 是"整组覆盖"而不是叠加：只要某个 location
    # 里写了任意一条 add_header，这一整组就不再从 server 继承下去。
    # 下面每个设缓存头的 location 都得把这条重复一遍，漏一个那个路径就没有
    # HSTS —— 而且 curl 不看这个头也不会报错，只有专门去查才发现。
    # 加 always 也救不了，那管的是错误响应，跟继承无关。
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /var/www/dope-website;
    index index.html;

    # 站点用的是 BrowserRouter，路由在浏览器里跑。服务器上只有一个
    # index.html，/review/films/xxx 这种路径在磁盘上并不存在 ——
    # 没有这条回退，直接访问深层链接或在深层页面刷新都会 404。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 文件名带内容哈希，改了内容名字就变，可以放心长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # 字体文件名不带哈希，缓存久一点但别标 immutable
    location /font/ {
        expires 30d;
        add_header Cache-Control "public";
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location /image/ {
        expires 30d;
        add_header Cache-Control "public";
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # index.html 必须每次校验，否则发了新版用户还拿旧的
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/css
        text/plain
        application/javascript
        application/json
        image/svg+xml;

    # 字体和图片已经是压缩格式，再 gzip 没有意义，别浪费 CPU
}

# ---------------------------------------------------------------------------
# 证书
#
# 用 acme.sh 而不是 certbot：服务器是 CentOS 7，连 python3 都没有，
# 现在的 certbot 要 Python 3.8+，装不上。acme.sh 是纯 shell 的。
#
#   acme.sh --issue -d l9k.dev -d www.l9k.dev -w /var/www/acme \
#           --keylength ec-256 --server letsencrypt
#   acme.sh --install-cert -d l9k.dev --ecc \
#           --key-file       /etc/nginx/ssl/l9k.dev.key \
#           --fullchain-file /etc/nginx/ssl/l9k.dev.fullchain.cer \
#           --reloadcmd      "systemctl reload nginx"
#
# --ecc 不能漏：证书是 ec-256 的，存在 l9k.dev_ecc/ 下，不加就找不到。
# 续期是 root 的 crontab 里的 acme.sh --cron，每天跑四次，到期前自动换并
# reload nginx，不需要人管。
# ---------------------------------------------------------------------------
