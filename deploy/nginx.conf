# 放到服务器的 /etc/nginx/sites-available/dope-website，
# 然后软链到 sites-enabled/：
#
#   sudo ln -s /etc/nginx/sites-available/dope-website /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name _;                      # 有域名了就填域名

    root /var/www/dope-website;
    index index.html;

    # 站点用的是 BrowserRouter，路由在浏览器里跑。服务器上只有一个
    # index.html，/review/films/xxx 这种路径在磁盘上并不存在 ——
    # 没有这条回退，直接访问深层链接或在深层页面刷新都会 404。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 文件名带内容哈希，改了内容名字就变，可以放心长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 字体文件名不带哈希，缓存久一点但别标 immutable
    location /font/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location /image/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # index.html 必须每次校验，否则发了新版用户还拿旧的
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/css
        text/plain
        application/javascript
        application/json
        image/svg+xml;

    # 字体和图片已经是压缩格式，再 gzip 没有意义，别浪费 CPU
}
